{% extends 'admin_dashboard/base.html' %}
{% block title %}Delete Rider{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-trash me-2"></i>Delete Rider</h5>
                </div>
                <div class="card-body text-center py-4">
                    <p class="fs-5">Are you sure you want to delete <strong>{{ rider.name }}</strong> ({{ rider.rider_id }})?</p>
                    <p class="text-muted">This action cannot be undone.</p>
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
                        <a href="{% url 'admin_dashboard:rider_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
