{% extends 'admin_dashboard/base.html' %}
{% block title %}{{ action }} Rider{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-motorcycle me-2"></i>{{ action }} Rider</h5>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-danger">{{ msg }}</div>
                        {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rider ID</label>
                            <input type="text" name="rider_id" class="form-control" value="{{ rider.rider_id|default:'' }}" placeholder="Auto-generated if left blank">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name *</label>
                            <input type="text" name="name" class="form-control" value="{{ rider.name|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number *</label>
                            <input type="text" name="phone" class="form-control" value="{{ rider.phone|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">National ID Number</label>
                            <input type="text" name="id_number" class="form-control" value="{{ rider.id_number|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Plate Number *</label>
                            <input type="text" name="plate_number" class="form-control" value="{{ rider.plate_number|default:'' }}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select">
                                <option value="active" {% if rider.status == 'active' or not rider %}selected{% endif %}>Active</option>
                                <option value="inactive" {% if rider.status == 'inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">{{ action }} Rider</button>
                            <a href="{% url 'admin_dashboard:rider_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
